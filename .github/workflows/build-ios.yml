name: Build iOS 9 (Theos)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz make

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: Download iPhoneOS9.3 SDK
        run: |
          mkdir -p $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS9.3.sdk $HOME/theos/sdks/ || true
          ls -la $HOME/theos/sdks/

      - name: Build
        working-directory: ios
        run: |
          make clean || true
          make TARGET=iphone:clang:9.3:9.0 ARCHS=armv7

      - name: Inspect binary
        working-directory: ios
        run: |
          BIN="$(find .theos -type f -name FuoEvolve9 -perm -u+x | head -1)"
          if [ -n "$BIN" ]; then
            file "$BIN"
            otool -L "$BIN" || true
          else
            echo "Binary not found"
            exit 1
          fi

      - name: Package IPA
        working-directory: ios
        run: |
          chmod +x make_ipa.sh
          ./make_ipa.sh
          ls -lh FuoEvolve9.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuoEvolve9-ipa
          path: ios/FuoEvolve9.ipa
          if-no-files-found: error
